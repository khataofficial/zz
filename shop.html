<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store</title><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111"><script src="theme.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;padding-bottom:96px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.97)}
input,select,textarea{font:inherit;font-size:15px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.top{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto}
.lg{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex:none}.lg img{width:100%;height:100%;object-fit:cover}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--soft)}
.ib{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:18px;position:relative;flex:none}
.ib i{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:99px;background:var(--accent);color:var(--on);font:700 11px/19px system-ui;text-align:center;font-style:normal}
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px}
.tools{display:flex;gap:8px}.tools select{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-weight:600;white-space:nowrap}.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.info{background:var(--chip);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13px;color:var(--soft)}.info.bad{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}html[data-grid="s"] .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}html[data-grid="l"] .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:5px}
.pic{aspect-ratio:1;border-radius:13px;background:var(--chip);display:grid;place-items:center;font-size:52px;overflow:hidden;width:100%;position:relative}.pic img{width:100%;height:100%;object-fit:cover}
.pic em{position:absolute;left:6px;top:6px;background:var(--card);border-radius:99px;font:700 11px system-ui;padding:3px 8px;font-style:normal}
.p h3{margin:2px 0 0;font-size:14px;font-weight:700}.pr{font-weight:800;font-size:16px}
.add{margin-top:auto;background:var(--accent);color:var(--on);border-radius:12px;padding:10px;font-weight:700}.add:disabled{background:var(--chip);color:var(--soft)}
.q{margin-top:auto;display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:12px}.q button{width:42px;height:40px;font-size:20px;font-weight:800}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);padding:40px 10px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:936px;background:var(--accent);color:var(--on);border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){body{padding-bottom:32px}header{padding:14px 24px}.top{gap:14px}.nm b{font-size:19px}.wrap{padding-top:24px}.ib{width:auto;min-width:112px;padding:0 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}.ib i{top:-7px;right:-7px}}@media(min-width:600px){.ov{align-items:center}.sh{border-radius:22px}}
.sh h2{margin:0 0 10px;font-size:19px}label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin:10px 0 4px}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.li .pic{width:46px;font-size:26px;border-radius:10px;flex:none}.li .d{flex:1;min-width:0}.li .q{margin:0;width:104px;flex:none}
.sum{display:flex;justify-content:space-between;padding:3px 0}.sum.g{font-weight:800;font-size:18px;margin:6px 0 10px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px;font-weight:700}.seg button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.big{display:block;width:100%;text-align:center;text-decoration:none;background:var(--accent);color:var(--on);border-radius:14px;padding:14px;font-weight:800;margin-top:8px}.big:disabled{opacity:.5}
.alt{width:100%;padding:12px;color:var(--soft);font-weight:600}
.err{color:var(--ink);font-weight:600;min-height:18px;margin-top:6px}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}.ck input{width:20px;height:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-weight:600}
.hist{background:var(--chip);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}
[hidden]{display:none!important}

/* My Khata desktop storefront */
@media(min-width:900px){body{padding-bottom:28px;background:var(--bg)}header{padding:14px 34px}.top{max-width:1360px;gap:16px}.lg{width:46px;height:46px;border-radius:14px}.nm b{font-size:20px}.nm small{font-size:12px}.wrap{max-width:1360px;padding:24px 34px 48px}.tools{max-width:680px;margin:0 0 14px}.tools input{flex:1}.tools select{min-width:150px}.chips{padding:10px 0 18px}.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.p{padding:12px;border-radius:20px}.pic{border-radius:15px}.p h3{font-size:15px}.add{padding:12px}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style><link rel="stylesheet" href="yt.css"></head><body class="shp">
<header><div class="top"><div class="lg" id="lg"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9h18l-1.5-5h-15zM4 9v11h16V9M9 20v-6h6v6"/></svg></div><div class="nm"><b id="sn"></b><small id="ss"></small></div>
<button class="ib" data-a="inf" aria-label="Store info"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500h.01"/></svg><span>Info</span></button><button class="ib" data-a="ord" aria-label="My orders"><svg viewBox="0 0 24 24"><path d="M5 4h14v17l-3-2-2 2-2-2-2 2-2-2-3 2zM9 9h6M9 13h6"/></svg><span>My orders</span></button><button class="ib" data-a="thm" aria-label="Appearance"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18h1c2 0 2-2 1-3s0-2 2-2h1a4 4 0 004-4c0-5-4-9-9-9z"/><circle cx="7" cy="11" r="1"/><circle cx="11" cy="7" r="1"/></svg><span>Appearance</span></button><button class="ib" data-a="cart" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 12h11l3-9H6M9 20h.01M17 20h.01"/></svg><span>Cart</span><i id="cc" hidden>0</i></button></div></header>
<div class="wrap"><div id="hrs" class="hrs"></div>
<div class="tools"><input id="q" type="search" placeholder="Search" hidden>
<select id="srt" aria-label="Sort" hidden><option value="n">Name</option><option value="l">Price: low</option><option value="h">Price: high</option></select></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var slug=(new URLSearchParams(location.search).get('s')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
var sb,shop={},X={},cart={},cat='All',code='',mode='',F={};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}
try{cart=JSON.parse(ls('kf-cart-'+slug)||'{}')}catch(e){}
try{F=JSON.parse(ls('kf-me')||'{}')}catch(e){}
function rs(n){return (X.cur||'Rs')+' '+Math.round(n).toLocaleString('en-PK')}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1700)}
function P(){return shop.products||[]}
function prod(id){return P().filter(function(p){return p.id==id})[0]}
function maxFor(p){return Math.max(0,Math.min(+p.qty||0,X.maxq||1e9))}
var NOIMG='<svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 016 0"/></svg>';
function hasImg(p){return /^https?:\/\//.test(p.img||'')}
function pc(p){return hasImg(p)?'':' noimg'}
function pic(p){return hasImg(p)?'<img src="'+esc(p.img)+'" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.outerHTML=NOIMG">':NOIMG}
function saveCart(){ls('kf-cart-'+slug,JSON.stringify(cart))}
function count(){var n=0;for(var k in cart)n+=cart[k];return n}
function money(){var s=0;for(var k in cart){var p=prod(k);if(p)s+=p.price*cart[k]}
 var d=code&&code===X.cc?Math.round(s*(X.cp||0)/100):0,f=mode==='dv'&&!(X.free&&s>=X.free)?(X.fee||0):0;return{sub:s,disc:d,fee:f,grand:s-d+f}}
function isOpen(){if(X.acc===0)return false;if(!X.from||!X.to)return true;var d=new Date(),m=d.getHours()*60+d.getMinutes(),a=X.from.split(':'),b=X.to.split(':'),s=a[0]*60+ +a[1],e=b[0]*60+ +b[1];return s<=e?(m>=s&&m<e):(m>=s||m<e)}

function t12(t){var a=String(t||'').split(':'),h=+a[0],m=a[1]||'00';if(isNaN(h))return '';return ((h%12)||12)+':'+m+' '+(h<12?'AM':'PM')}
function hrs(){var el=$('hrs');if(!el)return;var open=isOpen(),paused=X.acc===0,has=X.from&&X.to;
 var main=paused?'Orders paused':(open?'Open now':'Closed'),sub=has?(open?'Closes at '+t12(X.to):'Opens at '+t12(X.from))+' · '+t12(X.from)+' – '+t12(X.to):(open?'Open all day':'');
 el.className='hrs'+(open&&!paused?'':' no');el.innerHTML='<i></i><b>'+main+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')}
function head(){$('sn').textContent=shop.name||'Shop';document.title=shop.name||'Shop';
 $('ss').textContent=[shop.city,isOpen()?'Open now':'Closed'].filter(Boolean).join(' • ');
 var l=/^https?:\/\//.test(X.logo||'')?'<img src="'+esc(X.logo)+'" alt="">':'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-1.5-5h-15zM4 9v11h16V9M9 20v-6h6v6"/></svg>';$('lg').innerHTML=l;
 hrs()}
function draw(){
 var list=P().filter(function(p){return !(X.hs&&maxFor(p)<=0)}),cats=['All'];
 list.forEach(function(p){if(p.cat&&cats.indexOf(p.cat)<0)cats.push(p.cat)});if(cats.indexOf(cat)<0)cat='All';
 $('chips').hidden=cats.length<2;$('chips').innerHTML=cats.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
 var q=$('q').value.toLowerCase().trim(),s=$('srt').value;
 var l=list.filter(function(p){return (cat==='All'||p.cat===cat)&&(p.name+' '+(p.desc||'')).toLowerCase().indexOf(q)>-1});
 l.sort(function(a,b){return s==='l'?a.price-b.price:s==='h'?b.price-a.price:a.name.localeCompare(b.name)});
 $('grid').innerHTML=l.length?l.map(function(p){var mx=maxFor(p),n=cart[p.id]||0,low=X.sq!==0&&mx>0&&mx<=5?'<em>Only '+mx+' left</em>':'';
  return '<div class="p"><button class="pic'+pc(p)+'" data-a="det" data-id="'+esc(p.id)+'" aria-label="Details">'+pic(p)+(mx<=0?'<em>Sold out</em>':low)+'</button><h3>'+esc(p.name)+'</h3><span class="pr">'+rs(p.price)+'</span>'+
  (mx<=0?'<button class="add" disabled>Sold out</button>':n?'<div class="q"><button data-a="mn" data-id="'+esc(p.id)+'" aria-label="Less">−</button><b>'+n+'</b><button data-a="ad" data-id="'+esc(p.id)+'" aria-label="More">+</button></div>':'<button class="add" data-a="ad" data-id="'+esc(p.id)+'">Add</button>')+'</div>'}).join(''):'<div class="empty">Nothing found</div>';
 var c=count(),m=money();$('cc').hidden=!c;$('cc').textContent=c;$('bar').hidden=!c;$('bc').textContent=c+' item'+(c>1?'s':'');$('bt').textContent='View cart • '+rs(m.sub)}
function add(id){var p=prod(id);if(!p)return;var n=(cart[id]||0)+1;if(n>maxFor(p)){toast(X.maxq&&maxFor(p)===X.maxq?'Max '+X.maxq+' per item':'Only '+maxFor(p)+' in stock');return}cart[id]=n;saveCart()}
function less(id){if(cart[id]>1)cart[id]--;else delete cart[id];saveCart()}

function sheet(h){document.body.style.overflow='hidden';$('modal').innerHTML='<div class="ov"><div class="sh"><div class="shb"><button class="back" data-a="x" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><b>'+esc(shop.name||'Store')+'</b></div><div class="shi">'+h+'</div></div></div>';var o=$('modal').firstChild;if(o)o.scrollTop=0}
function shut(){document.body.style.overflow='';$('modal').innerHTML='';draw()}
function grab(){var g=function(i){return $(i)?$(i).value:undefined};var o={n:g('fn'),p:g('fp'),a:g('fa'),y:g('fy'),m:g('fm'),c:g('fc')};for(var k in o)if(o[k]!==undefined)F[k]=o[k]}
function cartView(){
 if(!count()){shut();return}
 var dv=X.dv!==0,pk=!!X.pk;if(!mode||(mode==='dv'&&!dv)||(mode==='pk'&&!pk))mode=dv?'dv':(pk?'pk':'');
 var pays=String(X.pay||'Cash on delivery').split(',').map(function(x){return x.trim()}).filter(Boolean),R=X.rules||[],m=money();
 var h='<h2>Your cart</h2>'+Object.keys(cart).map(function(k){var p=prod(k);if(!p)return '';
  return '<div class="li"><div class="pic'+pc(p)+'">'+pic(p)+'</div><div class="d"><b>'+esc(p.name)+'</b><br><small>'+rs(p.price)+' × '+cart[k]+' = '+rs(p.price*cart[k])+'</small></div><div class="q"><button data-a="cm" data-id="'+esc(k)+'" aria-label="Less">−</button><b>'+cart[k]+'</b><button data-a="cp" data-id="'+esc(k)+'" aria-label="More">+</button></div></div>'}).join('');
 if(dv&&pk)h+='<label>How do you want it?</label><div class="seg"><button data-a="md" data-v="dv" class="'+(mode==='dv'?'on':'')+'">Delivery</button><button data-a="md" data-v="pk" class="'+(mode==='pk'?'on':'')+'">Pick up</button></div>';
 else if(!mode)h+='<div class="err">Delivery and pickup are both off right now.</div>';
 if(mode==='pk'&&(X.pa||X.sa))h+='<div class="info" style="margin-top:8px"><b>Pickup</b><br>'+esc(X.pa||X.sa)+'</div>';
 h+='<label>Name</label><input id="fn" maxlength="60" autocomplete="name" value="'+esc(F.n||'')+'"><label>Phone</label><input id="fp" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="Phone number" value="'+esc(F.p||'')+'">'+
 (mode==='dv'?'<label>Address</label><textarea id="fa" rows="2" maxlength="150" autocomplete="street-address">'+esc(F.a||'')+'</textarea>':'')+
 '<label>Payment</label><select id="fy">'+pays.map(function(x){return '<option'+(F.y===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select><label>Note (optional)</label><input id="fm" maxlength="60" value="'+esc(F.m||'')+'">'+
 (X.cc?'<label>Discount code</label><div style="display:flex;gap:8px"><input id="fc" maxlength="12" value="'+esc(F.c||code)+'"><button class="chip" data-a="cod" style="flex:none">Apply</button></div>':'')+
 '<div style="margin-top:12px"><div class="sum"><span>Subtotal</span><span>'+rs(m.sub)+'</span></div>'+(m.disc?'<div class="sum"><span>Discount '+X.cp+'%</span><span>− '+rs(m.disc)+'</span></div>':'')+(mode?'<div class="sum"><span>'+(mode==='pk'?'Pickup':'Delivery')+'</span><span>'+(m.fee?rs(m.fee):'Free')+'</span></div>':'')+'<div class="sum g"><span>Total</span><span>'+rs(m.grand)+'</span></div></div>'+
 (R.length?'<div class="info"><b>Store rules</b><br>'+R.map(function(r){return '• '+esc(r)}).join('<br>')+'</div>'+(X.agree?'<label class="ck"><input type="checkbox" id="ag"> I agree to the rules</label>':''):'')+
 '<div class="err" id="er">'+(isOpen()?'':esc(X.cm||'Store is closed.'))+'</div><button class="big" data-a="send" id="co"'+(!isOpen()||!mode?' disabled':'')+'>Send order</button><button class="alt" data-a="x">Keep shopping</button>';

function send(){grab();var nm=(F.n||'').trim(),ph=(F.p||'').trim(),ad=(F.a||'').trim(),m=money(),er=$('er');
 if(nm.length<2)return er.textContent='Enter your name.';if(ph.replace(/\D/g,'').length<10)return er.textContent='Enter a valid phone number.';
 if(mode==='dv'&&ad.length<5)return er.textContent='Enter your delivery address.';
 if(X.min&&m.sub<X.min)return er.textContent='Minimum order is '+rs(X.min)+'.';
 if(X.agree&&(X.rules||[]).length&&!$('ag').checked)return er.textContent='Please agree to the store rules.';
 ls('kf-me',JSON.stringify(F));
 var tail=' | Type: '+(mode==='pk'?'Pickup':'Home delivery')+' | Pay: '+F.y+' | Fee: '+m.fee+(code&&m.disc?' | Code: '+code+' -'+m.disc:'')+' | Total: '+m.grand+((F.m||'').trim()?' | '+F.m.trim():'')+((X.rules||[]).length&&X.agree?' | Rules: agreed':'');
 var items=Object.keys(cart).map(function(k){return{id:k,qty:cart[k]}});$('co').disabled=true;er.textContent='';
 sb.rpc('store_order',{p_slug:slug,p_name:nm,p_phone:ph,p_address:(mode==='pk'?'PICKUP at shop':ad)+tail,p_items:items}).then(function(r){
  if(r.error){$('co').disabled=false;er.textContent=/nothing available|stock/i.test(r.error.message||'')?'Some items just sold out. Please check your cart.':'Could not send. Please try again.';load(true);return}
  var sum=Object.keys(cart).map(function(k){var p=prod(k);return p?p.name+' x'+cart[k]:''}).filter(Boolean).join(', ');
  try{var H=JSON.parse(ls('kf-ord-'+slug)||'[]');H.unshift({t:Date.now(),s:sum,g:m.grand,p:F.y});ls('kf-ord-'+slug,JSON.stringify(H.slice(0,20)))}catch(e){}
  var wa=String(shop.wa||'').replace(/\D/g,'');cart={};code='';saveCart();
  sheet('<h2>Order sent</h2><p><b>'+esc(shop.name||'')+'</b> got your order.<br>Total <b>'+rs(m.grand)+'</b> • '+esc(F.y)+'</p><p style="color:var(--soft)">They will contact you on '+esc(ph)+'.</p>'+
   (wa?'<a class="big" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+encodeURIComponent('Hi, I placed an order ('+sum+'). Total '+rs(m.grand)+'. Name: '+nm)+'">Message on WhatsApp</a>':'')+'<button class="alt" data-a="x">Close</button>');
  load(true)}).catch(function(){$('co').disabled=false;er.textContent='No internet. Please try again.'})}
function detail(id){var p=prod(id);if(!p)return;var mx=maxFor(p);
 sheet('<div class="pic'+pc(p)+'" style="font-size:90px;border-radius:16px;margin-bottom:10px">'+pic(p)+'</div><h2>'+esc(p.name)+'</h2><div class="pr" style="font-size:20px">'+rs(p.price)+'</div>'+(p.cat?'<small style="color:var(--soft)">'+esc(p.cat)+'</small>':'')+(p.desc?'<p>'+esc(p.desc)+'</p>':'')+
 '<p style="color:var(--soft)">'+(mx<=0?'Sold out':(X.sq!==0?mx+' available':'In stock'))+'</p>'+(mx>0?'<button class="big" data-a="adc" data-id="'+esc(p.id)+'">Add</button>':'')+'<button class="alt" data-a="x">Close</button>')}

var IC={phone:'<path d="M5 4h4l2 5-2.500 1.500a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/>',chat:'<path d="M21 12a8 8 0 01-11.500 7.200L3 21l1.800-5.500A8 8 0 1121 12z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',pin:'<path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.500"/>',truck:'<path d="M3 6h11v11H3zM14 10h4l3 3v4h-7z"/><circle cx="7.500" cy="19" r="1.500"/><circle cx="17.500" cy="19" r="1.500"/>',shop:'<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 016 0"/>',cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.500"/>'};
function ico(n){return '<svg class="ico" viewBox="0 0 24 24">'+IC[n]+'</svg>'}
function info(){var open=isOpen(),hrs=X.from&&X.to?' · '+esc(X.from)+' – '+esc(X.to):'',ph=String(X.ph||shop.wa||'').replace(/[^0-9+]/g,''),wd=String(shop.wa||X.ph||'').replace(/\D/g,'').replace(/^0/,'92'),R=X.rules||[],adr=X.sa||X.pa||'',dv=X.dv!==0,pk=!!X.pk;
 var st=X.acc===0?'Orders paused':(open?'Open':'Closed')+hrs;
 var pays=String(X.pay||'Cash on delivery').split(',').map(function(x){return x.trim()}).filter(Boolean);
 var h='<h2>'+esc(shop.name||'Shop')+'</h2><div class="st '+(open?'':'no')+'"><i></i>'+st+'</div>'+
  '<div class="tags"><span class="tg'+(dv?'':' off')+'">'+ico('truck')+'Delivery</span><span class="tg'+(pk?'':' off')+'">'+ico('shop')+'Pickup</span>'+pays.map(function(x){return '<span class="tg">'+ico('cash')+esc(x)+'</span>'}).join('')+'</div>'+
  (R.length?'<ul class="rls">'+R.map(function(r,i){return '<li><b>'+(i+1)+'</b><span>'+esc(r)+'</span></li>'}).join('')+'</ul>':'');
 var c=(ph?'<a class="rb" href="tel:'+esc(ph)+'" aria-label="Call">'+ico('phone')+'</a>':'')+(wd?'<a class="rb wa" target="_blank" rel="noopener" href="https://wa.me/'+esc(wd)+'" aria-label="WhatsApp">'+ico('chat')+'</a>':'')+(X.em?'<a class="rb" href="mailto:'+esc(X.em)+'" aria-label="Email">'+ico('mail')+'</a>':'')+(adr?'<a class="rb" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(adr)+'" aria-label="Map">'+ico('pin')+'</a>':'');
 if(c)h+='<div class="cts">'+c+'</div>';if(adr)h+='<div class="adr">'+ico('pin')+'<span>'+esc(adr)+'</span></div>';
 sheet(h+'<button class="alt" data-a="x">Close</button>')}
function orders(){var H=[];try{H=JSON.parse(ls('kf-ord-'+slug)||'[]')}catch(e){}
 sheet('<h2>My orders</h2>'+(H.length?H.map(function(o){return '<div class="hist"><b>'+new Date(o.t).toLocaleString()+'</b><br>'+esc(o.s)+'<br><b>'+rs(o.g)+'</b> • '+esc(o.p)+'</div>'}).join(''):'<p style="color:var(--soft)">No orders yet from this phone.</p>')+'<button class="alt" data-a="x">Close</button>')}

document.addEventListener('click',function(e){var b=e.target.closest('button,a');if(!b)return;var a=b.getAttribute('data-a'),id=b.getAttribute('data-id');
 if(b.hasAttribute('data-c')){cat=b.getAttribute('data-c');draw();return}
 if(e.target.className==='ov'){shut();return}
 if(!a)return;
 if(a==='ad'){add(id);draw()}else if(a==='mn'){less(id);draw()}
 else if(a==='adc'){add(id);shut();toast('Added')}
 else if(a==='cp'){grab();add(id);cartView()}else if(a==='cm'){grab();less(id);cartView()}
 else if(a==='cart'){if(!count()){toast('Your cart is empty');return}cartView()}
 else if(a==='md'){grab();mode=b.getAttribute('data-v');cartView()}
 else if(a==='cod'){grab();var v=($('fc').value||'').trim().toUpperCase();code=v===X.cc?v:'';cartView();if(!code)$('er').textContent='That code is not valid.'}
 else if(a==='send'){send()}else if(a==='det'){detail(id)}else if(a==='ord'){orders()}
 else if(a==='inf'){info()}else if(a==='thm'){KTheme.panel()}else if(a==='x'){shut()}});
$('modal').addEventListener('click',function(e){if(e.target.className==='ov')shut()});
$('q').oninput=draw;$('srt').onchange=draw;

function fail(m){$('sn').textContent='Store unavailable';$('grid').innerHTML='<div class="empty">'+esc(m)+'</div>'}
function load(quiet){sb.rpc('store_get',{p_slug:slug}).then(function(r){
  if(r.error||!r.data){if(!quiet)fail('This store is not available right now. Check the link or try later.');return}
  shop=r.data;X=shop.x||{};
  for(var k in cart){var p=prod(k);if(!p||maxFor(p)<=0)delete cart[k];else if(cart[k]>maxFor(p))cart[k]=maxFor(p)}saveCart();
  KTheme.apply();document.documentElement.setAttribute('data-grid',X.grid||'m');head();$('q').hidden=false;$('srt').hidden=false;if(!$('modal').firstChild)draw();
 }).catch(function(){if(!quiet)fail('No internet. Please try again.')})}
if(!slug||!window.supabase||!window.KHATA_CFG){fail('This store link is not correct.')}
else{sb=supabase.createClient(KHATA_CFG.URL,KHATA_CFG.KEY,{auth:{persistSession:false,autoRefreshToken:false}});load();setInterval(function(){if(!document.hidden&&!$('modal').firstChild)load(true)},60000)}
})();
</script></body></html>
