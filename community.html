<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>My Khata – Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Community has its OWN theme (kc-mode / kc-accent). It never touches My Khata's theme. */
:root{--accent:#111;--on:#fff;--bg:#fff;--card:#fff;--card2:#f4f4f5;--input:#fafafa;--ink:#111;--soft:#666;--line:#e4e4e7;--hov:#ececee;--out:#ececee;--red:#111;--green:#111;--shadow:0 1px 3px rgba(0,0,0,.06)}
html[data-mode=dark]{--accent:#fff;--on:#111;--bg:#0d0d0f;--card:#161618;--card2:#1e1e21;--input:#0d0d0f;--ink:#fff;--soft:#a1a1aa;--line:#2e2e33;--hov:#2a2a2e;--out:#2a2a2e;--red:#fff;--green:#fff;--shadow:0 3px 12px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.ic{display:inline-flex;vertical-align:-.2em}
.ic svg,.i svg{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i{display:inline-flex}

.app{max-width:780px;margin:0 auto;padding:22px 16px 40px}

.stick{position:sticky;top:0;z-index:30;background:var(--bg);margin:-22px -16px 0;padding:22px 16px 12px}
/* ---------- header: same as My Khata ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
.top-l{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.hdr-av{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:var(--card2);object-fit:cover;display:block}
.name-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px;color:var(--ink)}
.plan-badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:6px 12px;font:800 12px/1 Inter,sans-serif;background:#38bdf8;color:#04283d}
.sub{font-size:12px;color:var(--soft);margin-top:2px}
.icons{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink);transition:background .15s}
.icon-btn:hover{background:var(--hov)}.icon-btn:active{transform:scale(.92)}
.icon-btn .ic svg{width:20px;height:20px}

/* ---------- tabs: same as My Khata ---------- */
.tabs{display:flex;gap:4px;margin:6px 0 0;background:var(--card2);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1 0 auto;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;min-width:70px}
.tab-btn:hover{background:var(--hov)}
.tab-btn.active,.tab-btn.active:hover{background:var(--accent);color:var(--on);box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* ---------- search (same look as My Khata) ---------- */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{width:100%;padding:12px 42px 12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--input);color:var(--ink);box-shadow:var(--shadow)}
.search-wrap input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search-wrap .search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--soft);pointer-events:none}
.empty{text-align:center;padding:40px 20px;color:var(--soft);font-size:14px;line-height:1.5}

/* ---------- avatars ---------- */
.av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:34px;height:34px;font-size:14px}
.av.sq{border-radius:14px}
.av.lg{width:64px;height:64px;font-size:26px}

/* ---------- chat list ---------- */
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:12px}
.li:hover{background:var(--hov)}
.li .tx{flex:1;min-width:0}
.li .l1{display:flex;align-items:baseline;gap:8px}
.li .nm{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tm{font-size:11.5px;color:var(--soft)}
.li .l2{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* ---------- message bubbles (posts + chat) ---------- */
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.day{align-self:center;background:var(--card2);color:var(--soft);font-size:12px;padding:4px 12px;border-radius:99px;margin:8px 0}
.msg{display:flex;gap:8px;align-items:flex-end;border-radius:12px;position:relative}
.msg.me{flex-direction:row-reverse}
.msg.sel{background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:-100vw 0 0 color-mix(in srgb,var(--accent) 18%,transparent),100vw 0 0 color-mix(in srgb,var(--accent) 18%,transparent)}
.bub{max-width:min(82%,520px);padding:8px 11px 6px;border-radius:14px;border-bottom-left-radius:4px;background:var(--card2);font-size:14.5px;line-height:1.4;overflow-wrap:anywhere;cursor:pointer;user-select:none}
html[data-mode=dark] .bub{background:#243244}
.me .bub{background:var(--out);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
html[data-mode=dark] .me .bub{background:#2a2a2e}
.bub .sn{font-weight:700;font-size:12.5px;margin-bottom:2px;color:var(--accent)}
.bub .t{white-space:pre-wrap}
.bub .foot{display:flex;align-items:center;justify-content:flex-end;gap:2px;margin-top:3px;margin-right:-4px;color:var(--soft);font-size:11px}
.bub .foot time{margin-right:4px}
.bub .foot button{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.bub .foot button:hover{background:var(--hov);color:var(--ink)}
.bub .foot button.on{color:var(--accent)}
.bub .foot button.on svg{fill:currentColor}
.bub .foot .ic svg{width:15px;height:15px}

/* ---------- compose bar (like WhatsApp) ---------- */
.compose-spacer{height:74px}
.compose{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0))}
.compose form{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:center}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--input);border-radius:24px;padding:12px 18px;font-size:15px;outline:none}
.compose input:focus{border-color:var(--accent)}
.send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,opacity .15s}
.send .ic svg{width:21px;height:21px}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.45;cursor:default}

/* ---------- selection bar (replaces header when messages are selected) ---------- */
.selbar{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--accent);color:var(--on);padding-top:env(safe-area-inset-top,0)}
.selbar .in{max-width:780px;margin:0 auto;height:78px;display:flex;align-items:center;gap:4px;padding:0 10px}
.selbar b{flex:1;font-size:17px;margin-left:6px}
.selbar button{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on)}
.selbar button:hover{background:rgba(255,255,255,.18)}
.selbar .ic svg{width:21px;height:21px}

/* ---------- stores ---------- */
.stores{display:flex;flex-direction:column;gap:14px}
.store-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.store-head{display:flex;align-items:center;gap:12px}
.store-name{font-size:16.5px;font-weight:800}
.store-meta{font-size:12.5px;color:var(--soft);margin-top:2px}
.prods{list-style:none;margin:12px 0 0;padding:0;border-top:1px dashed var(--line)}
.prods li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.prods li:last-child{border-bottom:0}
.prods .pi{width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prods .pi .ic svg{width:16px;height:16px}
.prods .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prods .pp{font-weight:700;white-space:nowrap}
.store-acts{display:flex;gap:10px;margin-top:12px}
.store-acts button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-pri{background:var(--accent);color:var(--on)}
.btn-soft{background:var(--card2);color:var(--ink)}
html[data-mode=dark] .btn-soft{background:var(--hov)}
.btn-soft:hover{background:var(--hov)}

/* ---------- saved ---------- */
.saved-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.saved-item .h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.saved-item .h b{flex:1;font-size:14px}
.saved-item .h small{color:var(--soft);font-size:11.5px}
.saved-item p{margin:0 0 6px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.saved-item .acts{display:flex;gap:2px;justify-content:flex-end;margin-right:-6px}
.saved-item .acts button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.saved-item .acts button:hover{background:var(--hov);color:var(--ink)}
.chip-src{font-size:11px;font-weight:700;background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--accent);border-radius:99px;padding:2px 9px}

/* ---------- chat screen (full overlay) ---------- */
.chat-ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.chat-top{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.chat-top .in{max-width:780px;margin:0 auto;height:60px;display:flex;align-items:center;gap:8px;padding:0 10px}
.chat-top .ct{flex:1;min-width:0;line-height:1.25}
.chat-top .ct b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-top .ct small{color:var(--soft);font-size:12px}
.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chat-body .msgs{max-width:780px;margin:0 auto;padding:12px 16px}
.chat-ov .compose{position:static}

/* ---------- settings page (same look as My Khata settings) ---------- */
.ov{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov.on{display:block}
.sheet{background:transparent;color:var(--ink);width:100%;max-width:820px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0))}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--accent);padding:6px 0;margin-bottom:6px}
.set-h{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-size:22px;font-weight:800}
.set-crumb{font-size:11px;color:var(--soft);margin:-8px 0 14px}
.set-prof{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--card2);margin-bottom:6px;cursor:pointer;width:100%;text-align:left}
.set-pn{font-weight:800;font-size:16px}.set-ps{font-size:12px;color:var(--soft);margin-top:2px}
.set-sec{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--soft);margin:18px 4px 8px}
.set-list{display:flex;flex-direction:column;gap:8px}
.set-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--card2);width:100%;text-align:left}
.set-row:hover{background:var(--hov)}
.set-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--accent);flex-shrink:0}
.set-tx{flex:1;min-width:0}.set-t{font-weight:700;font-size:14px}.set-d{font-size:12px;color:var(--soft);margin-top:2px}
.set-val{font-size:12px;color:var(--soft);font-weight:700}
.set-blk{padding:13px 14px;border-radius:12px;background:var(--card2)}
.set-blk .set-t{margin-bottom:10px}
.prof{display:flex;align-items:center;gap:12px}
.prof .fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.sheet input[type=text],.sheet input[type=url]{width:100%;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
.sheet input:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.blk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk b{flex:1;font-size:14px}
.blk button{padding:7px 13px;border-radius:9px;background:var(--card2);font-weight:700;font-size:13px}
.blk button:hover{background:var(--hov)}
.note{font-size:12.5px;color:var(--soft);line-height:1.5;margin:0}
.save-row{margin-top:12px}
.save-row button{width:100%;padding:11px;border-radius:10px;background:var(--accent);color:var(--on);font-weight:700}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:13.5px;z-index:200;max-width:90vw;display:flex;gap:12px;align-items:center}
.toast button{font-weight:800;color:var(--accent);padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stick"><header class="top">
    <a class="top-l" href="index.html" aria-label="Back to My Khata">
      <img class="hdr-av" id="logo" alt="">
      <div>
        <div class="name-row"><h1>My Khata</h1><span class="plan-badge">Free</span></div>
        <div class="sub">Customer credit ledger, stock &amp; finance</div>
      </div>
    </a>
    <div class="icons"><button class="icon-btn" id="setBtn" type="button" aria-label="Community settings"></button></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Community"></nav></div>
  <main id="main"></main>
</div>

<div class="selbar" id="selbar" hidden></div>
<div class="compose" id="postCompose" hidden>
  <form id="postForm" autocomplete="off"><input id="postIn" type="text" maxlength="1000" placeholder="Write a post" aria-label="Write a post"><button class="send" id="postSend" type="submit" aria-label="Send" disabled></button></form>
</div>

<section class="chat-ov" id="chat" hidden>
  <div class="chat-top"><div class="in">
    <button class="icon-btn" id="chatBack" type="button" aria-label="Back"></button>
    <div class="av sm" id="chatAv"></div>
    <div class="ct"><b id="chatName"></b><small id="chatSub"></small></div>
  </div></div>
  <div class="chat-body" id="chatBody"><div class="msgs" id="chatMsgs"></div></div>
  <div class="compose"><form id="chatForm" autocomplete="off"><input id="chatIn" type="text" maxlength="1000" placeholder="Type a message" aria-label="Type a message"><button class="send" id="chatSend" type="submit" aria-label="Send" disabled></button></form></div>
</section>

<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-label="Community settings"></div></div>

/* ---------- data (filled from real accounts) ---------- */
var U={};
var posts=[];
var chats=[];
var stores=[];
var sub=''; // post cache for saved lookup
var SRC={}; // saved items: id -> {id,name,t,at,src}

/* ---------- helpers ---------- */
var PAL=[];
function hue(s){var h=0;s=String(s||'?');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return PAL[h%PAL.length];}
function nameOf(u){return u==='me'?(S.me.name||'You'):(U[u]||u);}
function av(u,cls){
  var n=nameOf(u),dp=u==='me'?S.me.dp:'',c='';
  var ini=esc((Array.from(n.trim())[0]||'?').toUpperCase());
  return '<div class="av '+(cls||'')+'" '+c+'>'+(dp?'<img src="'+esc(dp)+'" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=\''+ini+'\'">':ini)+'</div>';
}
function hm(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function same(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function dayLbl(t){var d=new Date(t),n=new Date();if(same(d,n))return 'Today';var y=new Date(n);y.setDate(n.getDate()-1);if(same(d,y))return 'Yesterday';return d.toLocaleDateString([],{day:'numeric',month:'short'});}
function listTime(t){var d=new Date(t),n=new Date();if(same(d,n))return hm(t);var y=new Date(n);y.setDate(n.getDate()-1);if(same(d,y))return 'Yesterday';return d.toLocaleDateString([],{day:'numeric',month:'short'});}
function toast(m,undo){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML='<span>'+esc(m)+'</span>';
  if(undo){var b=document.createElement('button');b.textContent='Undo';b.onclick=function(){undo();t.remove();};t.appendChild(b);}
  document.body.appendChild(t);setTimeout(function(){t.remove();},undo?4500:2000);}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Copied');},function(){toast('Could not copy');});else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied');}catch(e){toast('Could not copy');}a.remove();}}
function isBlocked(u){return S.blocked.indexOf(u)>=0;}
function searchBox(id,ph,val){return '<div class="search-wrap"><input type="text" id="'+id+'" placeholder="'+ph+'" value="'+esc(val||'')+'" autocomplete="off" aria-label="'+ph+'"><span class="search-icon">'+ic('search',18)+'</span></div>';}

/* ---------- messages (shared by posts + chat) ---------- */
var sel={ctx:null,ids:{}};
function selCount(){return Object.keys(sel.ids).length;}
function clearSel(){sel={ctx:null,ids:{}};drawSel();redrawActive();}
function bubbleHTML(m,showName,src){
  var mine=m.u==='me',on=!!sel.ids[m.id],sv=!!S.saved[m.id];
  return '<div class="msg'+(mine?' me':'')+(on?' sel':'')+'" data-id="'+m.id+'">'+(!mine&&showName?av(m.u,'sm'):'')+
   '<div class="bub" role="button" tabindex="0" aria-pressed="'+on+'">'+(!mine&&showName?'<div class="sn" style="color:'+hue(nameOf(m.u))+'">'+esc(nameOf(m.u))+'</div>':'')+
   '<div class="t">'+esc(m.t)+'</div><div class="foot"><time>'+hm(m.at)+'</time>'+
   '<button type="button" data-a="copy" aria-label="Copy">'+ic('copy')+'</button>'+
   '<button type="button" data-a="save" class="'+(sv?'on':'')+'" aria-label="'+(sv?'Unsave':'Save')+'">'+ic('bookmark')+'</button></div></div></div>';
}
function listHTML(list,showName){
  if(!list.length)return '';
  var h='',prev=null;
  list.forEach(function(m){var d=new Date(m.at);if(!prev||!same(prev,d))h+='<div class="day">'+dayLbl(m.at)+'</div>';prev=d;h+=bubbleHTML(m,showName);});
  return h;
}
function findMsg(id){
  var i,L=posts.concat(chatMsgsAll());
  for(i=0;i<L.length;i++)if(L[i].id===id)return L[i];return null;
}
function chatMsgsAll(){var a=[];chats.forEach(function(c){c.list.forEach(function(m){a.push(m);});});return a;}
chats.forEach(function(c){c.list=c.msgs.map(function(x,i){return {id:c.id+'m'+i,u:x.m?'me':c.u,t:x.t,at:x.at};});});
posts.forEach(function(p){p.u=p.u;});

function bindMsgs(root,ctx){
  root.onclick=function(e){
    var row=e.target.closest('.msg');if(!row)return;
    var id=row.getAttribute('data-id'),m=findMsg(id);if(!m)return;
    var b=e.target.closest('button[data-a]');
    if(b){
      e.stopPropagation();
      if(b.getAttribute('data-a')==='copy')copyText(m.t);
      else toggleSave(m,ctx);
      return;
    }
    if(sel.ctx&&sel.ctx!==ctx){sel={ctx:null,ids:{}};}
    sel.ctx=ctx;
    if(sel.ids[id])delete sel.ids[id];else sel.ids[id]=1;
    if(!selCount())sel.ctx=null;
    drawSel();row.classList.toggle('sel',!!sel.ids[id]);
    var bub=row.querySelector('.bub');if(bub)bub.setAttribute('aria-pressed',String(!!sel.ids[id]));
  };
  root.onkeydown=function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('bub')){e.preventDefault();e.target.click();}};
}
function toggleSave(m,ctx){
  if(S.saved[m.id]){delete S.saved[m.id];toast('Removed from Saved');}
  else{S.saved[m.id]={id:m.id,u:m.u,name:nameOf(m.u),t:m.t,at:m.at,src:ctx==='post'?'Post':'Chat'};toast('Saved');}
  persist();redrawActive();
}
function selMsgs(){return Object.keys(sel.ids).map(findMsg).filter(Boolean);}
function drawSel(){
  var n=selCount(),bar=$('selbar');
  if(!n){bar.hidden=true;bar.innerHTML='';return;}
  var L=selMsgs(),allMine=L.every(function(m){return m.u==='me';}),allOthers=L.every(function(m){return m.u!=='me';});
  var ctx=sel.ctx;
  bar.hidden=false;
  bar.innerHTML='<div class="in"><button type="button" data-s="x" aria-label="Cancel">'+ic('x')+'</button><b>'+n+' selected</b>'+
   '<button type="button" data-s="copy" aria-label="Copy">'+ic('copy')+'</button>'+
   '<button type="button" data-s="save" aria-label="Save">'+ic('bookmark')+'</button>'+
   (ctx==='post'&&allOthers?'<button type="button" data-s="block" aria-label="Block user">'+ic('ban')+'</button>':'')+
   (allMine?'<button type="button" data-s="del" aria-label="Delete">'+ic('trash-2')+'</button>':'')+'</div>';
}
$('selbar').addEventListener('click',function(e){
  var b=e.target.closest('[data-s]');if(!b)return;
  var a=b.getAttribute('data-s'),L=selMsgs(),ctx=sel.ctx;
  if(a==='x'){clearSel();return;}
  if(a==='copy'){copyText(L.map(function(m){return m.t;}).join('\n'));clearSel();return;}
  if(a==='save'){L.forEach(function(m){if(!S.saved[m.id])S.saved[m.id]={id:m.id,u:m.u,name:nameOf(m.u),t:m.t,at:m.at,src:ctx==='post'?'Post':'Chat'};});persist();toast('Saved');clearSel();return;}
  if(a==='del'){
    var ids=L.map(function(m){return m.id;});
    if(ctx==='post')posts=posts.filter(function(p){return ids.indexOf(p.id)<0;});
    else{var c=chats.filter(function(c){return c.id===openChatId;})[0];if(c)c.list=c.list.filter(function(m){return ids.indexOf(m.id)<0;});}
    ids.forEach(function(i){delete S.saved[i];});persist();toast('Deleted');clearSel();return;
  }
  if(a==='block'){
    var us=[];L.forEach(function(m){if(us.indexOf(m.u)<0)us.push(m.u);});
    us.forEach(function(u){if(!isBlocked(u))S.blocked.push(u);});persist();
    toast(us.length===1?nameOf(us[0])+' blocked':us.length+' users blocked',function(){us.forEach(function(u){S.blocked=S.blocked.filter(function(x){return x!==u;});});persist();redrawActive();});
    clearSel();
  }
});

/* ---------- tabs ---------- */
var TABS=[['post','Post'],['chat','Chat'],['store','Store'],['saved','Saved']];
var tab='post',openChatId=null,q={chat:'',store:'',saved:''};
function drawTabs(){$('tabs').innerHTML=TABS.map(function(t){return '<button type="button" class="tab-btn'+(tab===t[0]?' active':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>';}).join('');}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b)go(b.getAttribute('data-t'));});
function go(t){if(t!==tab&&sel.ctx==='post')sel={ctx:null,ids:{}};tab=t;drawSel();drawTabs();show();}
function redrawActive(){if(openChatId)drawChat(false);else show(true);}
function show(keep){
  var m=$('main'),pc=$('postCompose');
  pc.hidden=tab!=='post';
  ({post:vPost,chat:vChat,store:vStore,saved:vSaved})[tab](m,keep);
}

/* ---------- Post ---------- */
function vPost(m,keep){
  var L=posts.filter(function(p){return !isBlocked(p.u);});
  var y=window.scrollY;
  m.innerHTML=(L.length?'<div class="msgs" id="pl">'+listHTML(L,true)+'</div>':'<div class="empty">No posts yet.<br>Write the first post below.</div>')+'<div class="compose-spacer"></div>';
  var pl=$('pl');if(pl)bindMsgs(pl,'post');
  if(keep)window.scrollTo(0,y);else window.scrollTo(0,document.body.scrollHeight);
}
$('postIn').addEventListener('input',function(){$('postSend').disabled=!$('postIn').value.trim();});
$('postForm').addEventListener('submit',function(e){
  e.preventDefault();var v=$('postIn').value.trim();if(!v)return;
  posts.push({id:'p'+Date.now(),u:'me',t:v,at:new Date().toISOString()});
  $('postIn').value='';$('postSend').disabled=true;vPost($('main'),false);
});

/* ---------- Chat list ---------- */
function vChat(m){
  var s=q.chat.trim().toLowerCase();
  var L=chats.filter(function(c){return !isBlocked(c.u)&&c.list.length&&(!s||nameOf(c.u).toLowerCase().indexOf(s)>=0||c.list[c.list.length-1].t.toLowerCase().indexOf(s)>=0);});
  L.sort(function(a,b){return new Date(b.list[b.list.length-1].at)-new Date(a.list[a.list.length-1].at);});
  m.innerHTML=searchBox('qc','Search chats',q.chat)+'<div id="cl">'+(L.length?L.map(function(c){var l=c.list[c.list.length-1];
    return '<button type="button" class="li" data-c="'+c.id+'">'+av(c.u)+'<div class="tx"><div class="l1"><span class="nm">'+esc(nameOf(c.u))+'</span><span class="tm">'+listTime(l.at)+'</span></div><div class="l2">'+(l.u==='me'?'You: ':'')+esc(l.t)+'</div></div></button>';}).join(''):'<div class="empty">'+(s?'Koi chat nahi mili.':'Abhi koi chat nahi.<br>Store tab se kisi se baat shuru karein.')+'</div>')+'</div>';
  var i=$('qc');i.oninput=function(){q.chat=i.value;var p=i.selectionStart;vChat(m);var n=$('qc');n.focus();n.setSelectionRange(p,p);};
  $('cl').onclick=function(e){var b=e.target.closest('[data-c]');if(b)openChat(b.getAttribute('data-c'));};
}
function openChat(id){
  openChatId=id;sel={ctx:null,ids:{}};drawSel();
  $('chat').hidden=false;document.body.classList.add('noscroll');
  try{history.pushState({chat:1},'');}catch(e){}
  drawChat(true);
}
function drawChat(scroll){
  var c=chats.filter(function(x){return x.id===openChatId;})[0];if(!c)return;
  $('chatName').textContent=nameOf(c.u);$('chatSub').textContent=stores.some(function(s){return s.u===c.u;})?'Store owner':'Community member';
  $('chatAv').outerHTML=av(c.u,'sm').replace('class="av sm"','class="av sm" id="chatAv"');
  var body=$('chatBody'),near=scroll||body.scrollHeight-body.scrollTop-body.clientHeight<120;
  $('chatMsgs').innerHTML=c.list.length?listHTML(c.list,false):'<div class="empty">No messages yet.<br>Send the first message.</div>';
  bindMsgs($('chatMsgs'),'chat');
  if(near)body.scrollTop=body.scrollHeight;
}
function closeChat(){
  if(!openChatId)return;
  if(sel.ctx==='chat'){sel={ctx:null,ids:{}};drawSel();}
  openChatId=null;$('chat').hidden=true;document.body.classList.remove('noscroll');show(true);
}
$('chatBack').onclick=function(){if(history.state&&history.state.chat)history.back();else closeChat();};
window.addEventListener('popstate',function(){if(openChatId)closeChat();});
$('chatIn').addEventListener('input',function(){$('chatSend').disabled=!$('chatIn').value.trim();});
$('chatForm').addEventListener('submit',function(e){
  e.preventDefault();var v=$('chatIn').value.trim();if(!v)return;
  var c=chats.filter(function(x){return x.id===openChatId;})[0];if(!c)return;
  c.list.push({id:c.id+'m'+Date.now(),u:'me',t:v,at:new Date().toISOString()});
  $('chatIn').value='';$('chatSend').disabled=true;drawChat(true);
});
function startChatWith(u){
  var c=chats.filter(function(x){return x.u===u;})[0];
  if(!c){c={id:'c'+Date.now(),u:u,msgs:[],list:[]};chats.push(c);}
  openChat(c.id);
}

/* ---------- Store ---------- */
function vStore(m){
  var s=q.store.trim().toLowerCase();
  var L=stores.filter(function(x){return !isBlocked(x.u)&&(!s||x.name.toLowerCase().indexOf(s)>=0);});
  m.innerHTML=searchBox('qs','Search stores',q.store)+'<div class="stores" id="sl">'+(L.length?L.map(function(x){
    return '<article class="store-card"><div class="store-head">'+av(x.u,'sq')+'<div style="min-width:0"><div class="store-name">'+esc(x.name)+'</div><div class="store-meta">'+x.n+' products</div></div></div>'+
     '<ul class="prods">'+x.p.slice(0,5).map(function(p){return '<li><span class="pi">'+ic('package')+'</span><span class="pn">'+esc(p[0])+'</span><span class="pp">'+esc(p[1])+'</span></li>';}).join('')+'</ul>'+
     '<div class="store-acts"><button type="button" class="btn-pri" data-a="open" data-u="'+x.u+'">'+ic('store')+'Open store</button><button type="button" class="btn-soft" data-a="chat" data-u="'+x.u+'">'+ic('message-circle')+'Chat</button></div></article>';}).join(''):'<div class="empty">Koi store nahi mila.</div>')+'</div>';
  var i=$('qs');i.oninput=function(){q.store=i.value;var p=i.selectionStart;vStore(m);var n=$('qs');n.focus();n.setSelectionRange(p,p);};
  $('sl').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var u=b.getAttribute('data-u');
    if(b.getAttribute('data-a')==='chat')startChatWith(u);else{var x=stores.filter(function(z){return z.u===u;})[0];if(x&&x.slug)window.open('shop.html?s='+encodeURIComponent(x.slug),'_blank');else toast('Store link not available');}};
}

/* ---------- Saved ---------- */
function vSaved(m){
  var s=q.saved.trim().toLowerCase();
  var L=Object.keys(S.saved).map(function(k){return S.saved[k];}).filter(function(x){return !s||x.t.toLowerCase().indexOf(s)>=0||String(x.name).toLowerCase().indexOf(s)>=0;});
  L.sort(function(a,b){return new Date(b.at)-new Date(a.at);});
  m.innerHTML=searchBox('qv','Search saved',q.saved)+'<div id="vl">'+(L.length?L.map(function(x){
    return '<div class="saved-item" data-id="'+x.id+'"><div class="h">'+avObj(x)+'<b>'+esc(x.name)+'</b><span class="chip-src">'+esc(x.src)+'</span><small>'+listTime(x.at)+'</small></div><p>'+esc(x.t)+'</p><div class="acts"><button type="button" data-a="copy" aria-label="Copy">'+ic('copy')+'</button><button type="button" data-a="del" aria-label="Remove from Saved">'+ic('trash-2')+'</button></div></div>';}).join(''):'<div class="empty">'+(s?'Kuch nahi mila.':'Abhi kuch save nahi.<br>Kisi post ya message ka bookmark icon dabayein.')+'</div>')+'</div>';
  var i=$('qv');i.oninput=function(){q.saved=i.value;var p=i.selectionStart;vSaved(m);var n=$('qv');n.focus();n.setSelectionRange(p,p);};
  $('vl').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var id=b.closest('.saved-item').getAttribute('data-id'),x=S.saved[id];if(!x)return;
    if(b.getAttribute('data-a')==='copy')copyText(x.t);else{delete S.saved[id];persist();toast('Removed from Saved');vSaved(m);}};
}
function avObj(x){return av(x.u,'sm');}

/* ---------- settings (small, own theme) ---------- */
var ST=['root'];
function row(ic_,t,d,go,val){return '<button type="button" class="set-row" data-go="'+go+'"><span class="set-ic">'+ic(ic_,20)+'</span><span class="set-tx"><div class="set-t">'+t+'</div>'+(d?'<div class="set-d">'+d+'</div>':'')+'</span>'+(val?'<span class="set-val">'+val+'</span>':'')+'</button>';}
var PG={root:'Settings',prof:'Profile & photo',appr:'Appearance',blk:'Blocked users'};
function drawSettings(){
  var pg=ST[ST.length-1],bl=S.blocked,h='<button type="button" class="back-btn" data-back="1">'+ic('arrow-left',16)+' '+(ST.length>1?'Back':'Home')+'</button><h2 class="set-h">'+ic('settings',22)+' '+PG[pg]+'</h2>';
  if(pg==='root'){
    h+='<button type="button" class="set-prof" data-go="prof">'+av('me','lg')+'<div><div class="set-pn">'+esc(S.me.name||'You')+'</div><div class="set-ps">Community profile</div></div></button>'+
    '<div class="set-sec">General</div><div class="set-list">'+row('user','Profile & photo','Your name and picture','prof')+row('sun','Appearance','Light, dark or automatic','appr',esc(S.mode.charAt(0).toUpperCase()+S.mode.slice(1)))+row('ban','Blocked users','People whose posts you do not see','blk',bl.length?String(bl.length):'')+'</div>'+
    '<div class="set-sec">My Khata</div><div class="set-list"><a class="set-row" href="index.html" style="text-decoration:none;color:inherit"><span class="set-ic">'+ic('arrow-left',20)+'</span><span class="set-tx"><div class="set-t">Back to My Khata</div><div class="set-d">Open your ledger</div></span></a></div>';
  }else if(pg==='prof'){
    h+='<div class="set-blk"><div class="prof"><div id="pv">'+av('me','lg')+'</div><div class="fields"><input type="text" id="sName" maxlength="40" placeholder="Your name" value="'+esc(S.me.name)+'" aria-label="Your name"><input type="url" id="sDp" placeholder="Picture link" value="'+esc(S.me.dp)+'" aria-label="Picture link"></div></div><div class="save-row"><button type="button" id="sSave">Save</button></div></div>';
  }else if(pg==='appr'){
    h+='<div class="set-blk"><div class="set-t">Mode</div><div class="seg">'+[['light','sun','Light'],['dark','moon','Dark'],['auto','smartphone','Auto']].map(function(x){return '<button type="button" data-m="'+x[0]+'" class="'+(S.mode===x[0]?'on':'')+'">'+ic(x[1],16)+x[2]+'</button>';}).join('')+'</div></div>';
  }else{
    h+='<div class="set-blk">'+(bl.length?bl.map(function(u){return '<div class="blk">'+av(u,'sm')+'<b>'+esc(nameOf(u))+'</b><button type="button" data-u="'+u+'">Unblock</button></div>';}).join(''):'<p class="note">No blocked users. Select a post and tap the block icon to hide posts from that person.</p>')+'</div>';
  }
  $('sheet').innerHTML=h;
}
function openSettings(){ST=['root'];drawSettings();$('ov').classList.add('on');}
function closeSettings(){$('ov').classList.remove('on');}
$('setBtn').onclick=openSettings;
$('ov').addEventListener('click',function(e){
  var bk=e.target.closest('[data-back]');if(bk){if(ST.length>1){ST.pop();drawSettings();}else closeSettings();return;}
  var gg=e.target.closest('[data-go]');if(gg){ST.push(gg.getAttribute('data-go'));drawSettings();$('ov').scrollTop=0;return;}
  var b=e.target.closest('[data-m]');if(b){S.mode=b.getAttribute('data-m');persist();applyTheme();drawSettings();return;}
    b=e.target.closest('[data-u]');if(b){var u=b.getAttribute('data-u');S.blocked=S.blocked.filter(function(x){return x!==u;});persist();toast(nameOf(u)+' unblocked');drawSettings();redrawActive();return;}
  if(e.target.id==='sSave'){S.me.name=($('sName').value.trim()||'You');S.me.dp=$('sDp').value.trim();persist();toast('Profile saved');drawSettings();redrawActive();}
});
$('ov').addEventListener('input',function(e){if(e.target.id==='sDp'||e.target.id==='sName'){var o=S.me.dp,n=S.me.name;S.me.dp=$('sDp').value.trim();S.me.name=$('sName').value.trim()||'You';$('pv').innerHTML=av('me','lg');S.me.dp=o;S.me.name=n;}});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(selCount())clearSel();else if($('ov').classList.contains('on'))closeSettings();else if(openChatId)$('chatBack').click();});

/* ---------- start ---------- */
$('setBtn').innerHTML=ic('settings');$('chatBack').innerHTML=ic('arrow-left');$('postSend').innerHTML=ic('send');$('chatSend').innerHTML=ic('send');
applyTheme();drawTabs();show();
if(matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.mode==='auto')applyTheme();});}catch(e){}
})();
</script>
</body>
</html>
